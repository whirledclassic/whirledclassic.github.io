<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#f4eed8"/>
  <title>Notebook Sticks</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/whirledclassic/notebook-sticks-web@7f32e06f5a3591ff6932d5b8a46599a69929725b/style.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/whirledclassic/notebook-sticks-web@7f32e06f5a3591ff6932d5b8a46599a69929725b/ui.css"/>
</head>
<body>
  <div id="boot">
    <div class="sheet">
      <p class="kicker">a shared sketchbook</p>
      <h1>Notebook Sticks</h1>
      <p class="sub">Buy a blade. Wave, dance, Q, or /slash.</p>
      <canvas id="preview" width="180" height="160"></canvas>
      <label for="name">Name</label>
      <input id="name" type="text" maxlength="16" placeholder="Doodle" autocomplete="off" autofocus/>
      <label for="pin">PIN (optional)</label>
      <input id="pin" type="password" maxlength="8" placeholder="leave blank" autocomplete="off"/>
      <div id="saved-accounts"></div>
      <label>Ink color</label>
      <div class="row" id="colors"></div>
      <label>Hat</label>
      <div class="row" id="hats"></div>
      <button class="play" id="go" type="button">Open the notebook</button>
    </div>
  </div>
  <canvas id="game"></canvas>
  <div id="hud">
    <div id="br-banner"></div>
    <div id="replay-hud"></div>
    <div id="hint">Shop → Animated gear. Wave or Q to slash.</div>
    <div id="who"></div>
    <div id="ink">40 pencils · 3 erasers</div>
    <button id="member-badge" type="button" data-tier="free">free</button>
    <button id="admin-badge" type="button" hidden>admin</button>
    <div id="here">Walk the page.</div>
    <div id="pages"></div>
    <canvas id="mini" width="160" height="104"></canvas>
    <div id="dest"></div>
    <div id="roster"></div>
    <div id="chatlog"></div>
    <div id="shop"></div>
    <div id="member-box"></div>
    <div id="friends"></div>
    <div id="game-panel"></div>
    <div id="admin-box"></div>
    <div id="replay-box"></div>
    <div id="job-panel"></div>
    <div id="house-panel"></div>
    <div id="party-box"></div>
    <div id="mail-box"></div>
    <div id="trade-box"></div>
    <div id="profile-box"></div>
    <div id="store-box"></div>
    <div id="more-box"></div>
    <div id="prompt-box"></div>
    <div class="bar">
      <button id="look-toggle" type="button">Look</button>
      <button id="friends-toggle" type="button">Friends</button>
      <button id="party-toggle" type="button">Party</button>
      <button id="mail-toggle" type="button">Mail</button>
      <button id="interact-toggle" type="button">E</button>
      <button id="jobs-toggle" type="button">Jobs</button>
      <button id="house-toggle" type="button">Home</button>
      <button id="replay-toggle" type="button">Replay</button>
      <button id="admin-toggle" type="button" hidden>Admin</button>
      <button id="store-toggle" type="button">Store</button>
      <button id="member-toggle" type="button">Member</button>
      <button id="more-toggle" type="button">More</button>
      <button id="pose-wave" type="button">Wave</button>
      <button id="pose-sit" type="button">Sit</button>
      <button id="pose-dance" type="button">Dance</button>
      <button id="sfx-toggle" type="button">Sound on</button>
      <input id="chat" maxlength="140" placeholder="/slash · wave with a blade"/>
    </div>
    <div id="look">
      <b>Change doodle</b>
      <div class="row" id="look-colors"></div>
      <div class="row" id="look-hats"></div>
      <div class="row" id="look-extras"></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/gh/whirledclassic/notebook-sticks-web@7f32e06f5a3591ff6932d5b8a46599a69929725b/sound.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/whirledclassic/notebook-sticks-web@7f32e06f5a3591ff6932d5b8a46599a69929725b/account.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/whirledclassic/notebook-sticks-web@7f32e06f5a3591ff6932d5b8a46599a69929725b/membership.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/whirledclassic/notebook-sticks-web@7f32e06f5a3591ff6932d5b8a46599a69929725b/mock-net.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/whirledclassic/notebook-sticks-web@7f32e06f5a3591ff6932d5b8a46599a69929725b/world.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/whirledclassic/notebook-sticks-web@7f32e06f5a3591ff6932d5b8a46599a69929725b/engine.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/whirledclassic/notebook-sticks-web@7f32e06f5a3591ff6932d5b8a46599a69929725b/shop.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/whirledclassic/notebook-sticks-web@7f32e06f5a3591ff6932d5b8a46599a69929725b/fun.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/whirledclassic/notebook-sticks-web@7f32e06f5a3591ff6932d5b8a46599a69929725b/social.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/whirledclassic/notebook-sticks-web@7f32e06f5a3591ff6932d5b8a46599a69929725b/games.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/whirledclassic/notebook-sticks-web@7f32e06f5a3591ff6932d5b8a46599a69929725b/admin.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/whirledclassic/notebook-sticks-web@7f32e06f5a3591ff6932d5b8a46599a69929725b/replay.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/whirledclassic/notebook-sticks-web@7f32e06f5a3591ff6932d5b8a46599a69929725b/jobs.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/whirledclassic/notebook-sticks-web@7f32e06f5a3591ff6932d5b8a46599a69929725b/houses.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/whirledclassic/notebook-sticks-web@7f32e06f5a3591ff6932d5b8a46599a69929725b/money.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/whirledclassic/notebook-sticks-web@7f32e06f5a3591ff6932d5b8a46599a69929725b/pay.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/whirledclassic/notebook-sticks-web@7f32e06f5a3591ff6932d5b8a46599a69929725b/ui.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/whirledclassic/notebook-sticks-web@7f32e06f5a3591ff6932d5b8a46599a69929725b/gear.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/whirledclassic/notebook-sticks-web@7f32e06f5a3591ff6932d5b8a46599a69929725b/core.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/whirledclassic/notebook-sticks-web@7f32e06f5a3591ff6932d5b8a46599a69929725b/game.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/whirledclassic/notebook-sticks-web@7f32e06f5a3591ff6932d5b8a46599a69929725b/patch.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/whirledclassic/notebook-sticks-web@7f32e06f5a3591ff6932d5b8a46599a69929725b/hooks.js"></script>
</body>
</html>
