<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#f4eed8"/>
  <title>Notebook Sticks</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/whirledclassic/notebook-sticks-web@3c639d3c1a093d739e8c4e3c8ca697e9880e9b66/style.css"/>
</head>
<body>
  <div id="boot">
    <div class="sheet">
      <p class="kicker">a shared sketchbook</p>
      <h1>Notebook Sticks</h1>
      <p class="sub">Walk for stamps. Record a tape. /admin INKBOSS opens the desk. /br hello broadcasts.</p>
      <canvas id="preview" width="180" height="160"></canvas>
      <label for="name">Name</label>
      <input id="name" type="text" maxlength="16" placeholder="Doodle" autocomplete="off" autofocus/>
      <label for="pin">PIN (optional)</label>
      <input id="pin" type="password" maxlength="8" placeholder="leave blank" autocomplete="off"/>
      <div id="saved-accounts"></div>
      <label>Ink color</label>
      <div class="row" id="colors"></div>
      <label>Hat</label>
      <div class="row" id="hats"></div>
      <button class="play" id="go" type="button">Open the notebook</button>
      <p class="fine">R records. P plays. /kick Name · /mute Name · /ban Name</p>
    </div>
  </div>
  <canvas id="game"></canvas>
  <div id="hud">
    <div id="br-banner"></div>
    <div id="replay-hud"></div>
    <div id="hint">E interact. R record. F airplane. /admin INKBOSS</div>
    <div id="who"></div>
    <div id="ink">40 ink</div>
    <button id="member-badge" type="button" data-tier="free">free</button>
    <button id="admin-badge" type="button" hidden>admin</button>
    <div id="here">Walk the page.</div>
    <div id="pages"></div>
    <canvas id="mini" width="160" height="104"></canvas>
    <div id="dest"></div>
    <div id="roster"></div>
    <div id="chatlog"></div>
    <div id="shop"></div>
    <div id="member-box"></div>
    <div id="friends"></div>
    <div id="game-panel"></div>
    <div id="admin-box"></div>
    <div id="replay-box"></div>
    <div id="prompt-box"></div>
    <div class="bar">
      <button id="look-toggle" type="button">Look</button>
      <button id="friends-toggle" type="button">Friends</button>
      <button id="interact-toggle" type="button">E</button>
      <button id="replay-toggle" type="button">Replay</button>
      <button id="admin-toggle" type="button" hidden>Admin</button>
      <button id="member-toggle" type="button">Member</button>
      <button id="pose-wave" type="button">Wave</button>
      <button id="pose-sit" type="button">Sit</button>
      <button id="pose-dance" type="button">Dance</button>
      <button id="sfx-toggle" type="button">Sound on</button>
      <input id="chat" maxlength="140" placeholder="say hi · /br hello · /rec · /kick Name"/>
    </div>
    <div id="look">
      <b>Change doodle</b>
      <div class="row" id="look-colors"></div>
      <div class="row" id="look-hats"></div>
      <div class="row" id="look-extras"></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/gh/whirledclassic/notebook-sticks-web@3c639d3c1a093d739e8c4e3c8ca697e9880e9b66/sound.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/whirledclassic/notebook-sticks-web@3c639d3c1a093d739e8c4e3c8ca697e9880e9b66/account.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/whirledclassic/notebook-sticks-web@3c639d3c1a093d739e8c4e3c8ca697e9880e9b66/membership.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/whirledclassic/notebook-sticks-web@3c639d3c1a093d739e8c4e3c8ca697e9880e9b66/mock-net.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/whirledclassic/notebook-sticks-web@3c639d3c1a093d739e8c4e3c8ca697e9880e9b66/world.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/whirledclassic/notebook-sticks-web@3c639d3c1a093d739e8c4e3c8ca697e9880e9b66/engine.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/whirledclassic/notebook-sticks-web@3c639d3c1a093d739e8c4e3c8ca697e9880e9b66/shop.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/whirledclassic/notebook-sticks-web@3c639d3c1a093d739e8c4e3c8ca697e9880e9b66/fun.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/whirledclassic/notebook-sticks-web@3c639d3c1a093d739e8c4e3c8ca697e9880e9b66/social.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/whirledclassic/notebook-sticks-web@3c639d3c1a093d739e8c4e3c8ca697e9880e9b66/games.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/whirledclassic/notebook-sticks-web@3c639d3c1a093d739e8c4e3c8ca697e9880e9b66/admin.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/whirledclassic/notebook-sticks-web@3c639d3c1a093d739e8c4e3c8ca697e9880e9b66/replay.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/whirledclassic/notebook-sticks-web@3c639d3c1a093d739e8c4e3c8ca697e9880e9b66/game.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/whirledclassic/notebook-sticks-web@3c639d3c1a093d739e8c4e3c8ca697e9880e9b66/patch.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/whirledclassic/notebook-sticks-web@3c639d3c1a093d739e8c4e3c8ca697e9880e9b66/hooks.js"></script>
</body>
</html>
